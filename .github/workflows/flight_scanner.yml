name: Monitor de Vuelos 2027

on:
  schedule:
    # Se ejecuta automáticamente cada 2 horas (sin coste y con el PC apagado)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic en GitHub

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar escaneo de vuelos y enviar alertas a Telegram
        env:
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          AMADEUS_ENV: ${{ secrets.AMADEUS_ENV || 'production' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEFAULT_ORIGIN: 'MAD'
        run: |
          python -c "
          import os
          from flight_scanner import fetch_flights
          from tracker import analyze_new_deals
          from notifier import send_deal_alert
          from reporter import export_to_html, export_to_csv
          from settings_manager import (
              load_settings,
              save_settings,
              check_and_process_telegram_commands,
              send_welcome_and_top_deals
          )

          token = os.getenv('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.getenv('TELEGRAM_CHAT_ID', '').strip()

          print(f'🔍 Comprobando Telegram: Token={bool(token)}, ChatID={chat_id or \"(VACIO)\"}')

          # 1. Procesar comandos enviados desde Telegram (ej: /limite 350)
          settings = check_and_process_telegram_commands(token, chat_id)
          limit_price = settings.get('max_alert_price', 500.0)
          print(f'🎯 Límite actual para nuevos chollos: {limit_price:.0f} €')

          # 2. Escanear vuelos
          print('🔍 Escaneando vuelos...')
          flights, _ = fetch_flights('MAD', 2027, 5, 9)

          # 3. Enviar bienvenida y los 3 chollos actuales al móvil
          if not settings.get('welcome_sent', False):
              print('👋 Enviando bienvenida y Top 3 chollos al móvil...')
              send_welcome_and_top_deals(flights, token, chat_id, limit=limit_price)
              settings['welcome_sent'] = True
              save_settings(settings)

          # 4. Analizar bajadas de precio y nuevos chollos bajo el límite
          deals, enriched = analyze_new_deals(flights, alert_max_price=limit_price)
          
          export_to_html(enriched, 'MAD', filename='index.html')
          export_to_html(enriched, 'MAD', filename='comparador_vuelos_2027.html')
          export_to_csv(enriched)

          if deals:
              print(f'🚨 {len(deals)} ofertas detectadas (bajadas o <= {limit_price:.0f}€). Enviando alertas...')
              for deal in deals:
                  send_deal_alert(deal, bot_token=token)
          else:
              print('ℹ️ Sin variaciones de precio en esta ronda.')
          "

      - name: Guardar historial y ajustes para futuros escaneos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flight_history.json user_settings.json || true
          git commit -m "Auto: Actualizar historial y ajustes [skip ci]" || echo "Sin cambios"
          git push || echo "No se pudo hacer push"

      - name: Publicar Dashboard en GitHub Pages (Accesible desde tu móvil)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: false
